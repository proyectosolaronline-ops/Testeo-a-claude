<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Drive App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0ddd5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a18;
      border: 1px solid #2e2e2b;
      border-radius: 20px;
      padding: 48px 36px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
    }
    .logo { font-size: 48px; }
    h1 { font-size: 22px; font-weight: 700; color: #f5f4ef; }
    p { font-size: 14px; color: #7a7870; line-height: 1.6; }
    .btn-group { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary  { background: #1D9E75; color: #fff; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      background: #222220;
      color: #c2c0b8;
      border: 1.5px solid #3a3a37;
    }
    .btn-secondary:hover { background: #2a2a28; }
    .divider {
      width: 100%;
      height: 1px;
      background: #2e2e2b;
    }
    .footer { font-size: 11px; color: #4a4a47; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎥</div>
  <div>
    <h1>Video Drive App</h1>
    <p>Graba o sube videos directamente a Google Drive y reprodúcelos desde cualquier lugar.</p>
  </div>
  <div class="divider"></div>
  <div class="btn-group">
    <a class="btn btn-primary" href="subir.html">
      📤 Subir / Grabar video
    </a>
    <a class="btn btn-secondary" href="ver.html">
      ▶️ Ver video guardado
    </a>
  </div>
  <div class="footer">Los archivos se guardan en Google Drive vía Apps Script</div>
</div>
</body>
</html>
