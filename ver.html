<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ver Video</title>
</head>
<body style="text-align:center; font-family:sans-serif; background:#000; color:#fff; padding-top:50px;" onload="v()">

    <button onclick="window.location.href='index.html'" style="padding:10px; cursor:pointer;">
        REGRESAR A INDEX.HTML
    </button>

    <br><br><hr><br>

    <video id="p" controls style="width:100%; max-width:600px;"></video>

    <script>
        async function v(){
          const r = await fetch("https://script.google.com/macros/s/AKfycbxvy-Qcwaw1H2CLQ8L_P-rAHQd8pJ5v_ZjINVGDJ1yL6pW_MnQWzzXmNaDtP-oXUbuW/exec");
          const d = await r.json();
          if(d.url){
            const p = document.getElementById('p');
            p.src = d.url;
            p.muted = true;
            p.onloadedmetadata = () => p.currentTime = 0.1;
            p.load();
          }
        }
    </script>
</body>
</html>
