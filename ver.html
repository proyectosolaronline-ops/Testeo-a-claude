
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        .header { padding: 15px; text-align: center; background: #111; }
        .btn-back { background: #555; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; border: none; font-size: 14px; }
        .video-box { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
        video { width: 100%; border-radius: 15px; background: #111; max-height: 80vh; }
        #status { text-align: center; color: #888; font-size: 12px; padding: 10px; }
    </style>
</head>
<body onload="v()">
    <div class="header">
        <button class="btn-back" onclick="window.location.href='index.html'">⬅️ REGRESAR A CÁMARA</button>
    </div>

    <div id="status">Conectando con el servidor...</div>

    <div class="video-box">
        <video id="p" controls playsinline muted autoplay></video>
    </div>

    <script>
        async function v(){
          try {
              const res = await fetch("https://script.google.com/macros/s/AKfycbxvy-Qcwaw1H2CLQ8L_P-rAHQd8pJ5v_ZjINVGDJ1yL6pW_MnQWzzXmNaDtP-oXUbuW/exec");
              const data = await res.json();
              const player = document.getElementById('p');
              
              if(data.url){
                player.src = data.url;
                document.getElementById('status').innerText = "Video cargado correctamente";
                
                // Forzado manual para móviles
                player.load();
                player.onloadedmetadata = () => {
                    player.currentTime = 0.1;
                    player.play().catch(e => console.log("Auto-play bloqueado, requiere click"));
                };
              } else {
                document.getElementById('status').innerText = "No se encontró video en el Sheet";
              }
          } catch(e) {
              document.getElementById('status').innerText = "Error: Verifica tu conexión a internet";
          }
        }
    </script>
</body>
</html>
