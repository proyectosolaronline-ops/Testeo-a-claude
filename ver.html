<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir Video a Drive</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0ddd5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1a18;
      border: 1px solid #2e2e2b;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .top-nav { display: flex; align-items: center; gap: 10px; }
    .back-btn {
      font-size: 13px; color: #7a7870; text-decoration: none;
      display: flex; align-items: center; gap: 4px;
    }
    .back-btn:hover { color: #c2c0b8; }
    h1 { font-size: 20px; font-weight: 600; color: #f5f4ef; }
    p.sub { font-size: 13px; color: #7a7870; margin-top: 4px; }
    .source-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .source-btn {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; padding: 18px 8px;
      border-radius: 12px; border: 1.5px solid #3a3a37;
      background: #222220; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 13px; color: #9e9c94; text-align: center;
      line-height: 1.3; user-select: none;
    }
    .source-btn:hover { border-color: #5dc9a3; background: rgba(93,201,163,0.06); color: #c2c0b8; }
    .source-btn .icon { font-size: 28px; }
    #file-input, #camera-input { display: none; }
    .drop-zone {
      border: 2px dashed #3a3a37; border-radius: 12px;
      padding: 28px 20px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 13px; color: #7a7870;
    }
    .drop-zone:hover, .drop-zone.over { border-color: #5dc9a3; background: rgba(93,201,163,0.05); }
    .drop-zone span { color: #5dc9a3; }
    #live-wrap { display: none; flex-direction: column; gap: 12px; }
    #live-preview { width: 100%; border-radius: 10px; background: #000; max-height: 240px; transform: scaleX(-1); }
    .rec-controls { display: flex; gap: 10px; }
    .rec-btn {
      flex: 1; padding: 11px; border-radius: 10px; font-size: 14px;
      font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s;
    }
    .rec-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #start-rec { background: #c0392b; color: #fff; }
    #stop-rec  { background: #2a2a28; color: #c2c0b8; border: 1px solid #3a3a37; }
    .rec-indicator { display: none; align-items: center; gap: 6px; font-size: 12px; color: #e06c6c; }
    .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #e06c6c; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    #preview-wrap { display: none; flex-direction: column; gap: 10px; }
    #preview-video { width: 100%; border-radius: 10px; background: #000; max-height: 240px; }
    .file-info {
      font-size: 13px; color: #9e9c94;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px;
    }
