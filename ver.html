<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Videos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f0f;color:#e0ddd5;min-height:100vh;padding:24px}
    .top{display:flex;align-items:center;gap:16px;max-width:600px;margin:0 auto 24px}
    a.back{font-size:13px;color:#7a7870;text-decoration:none}a.back:hover{color:#c2c0b8}
    h1{font-size:20px;font-weight:600;color:#f5f4ef}
    .container{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

    /* Spinner */
    #spinner{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0}
    .spin{width:36px;height:36px;border:3px solid #2e2e2b;border-top-color:#1D9E75;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin-label{font-size:13px;color:#7a7870}

    /* Error */
    #error-box{display:none;background:#2e1010;border:1px solid #8c3030;border-radius:12px;padding:20px;color:#e06c6c;font-size:13px;line-height:1.6}

    /* Vacío */
    #empty-box{display:none;text-align:center;padding:60px 20px;color:#4a4a47;font-size:14px}

    /* Cards de video */
    .video-card{background:#1a1a18;border:1px solid #2e2e2b;border-radius:14px;overflow:hidden}
    .video-card video{width:100%;max-height:300px;background:#000;display:block}
    .video-info{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
    .video-name{font-size:14px;font-weight:600;color:#f5f4ef;word-break:break-word}
    .video-meta{font-size:12px;color:#7a7870}
    .video-actions{display:flex;gap:8px;margin-top:4px}
    .v-btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;text-decoration:none;text-align:center;transition:opacity .2s}
    .v-btn-primary{background:#1D9E75;color:#fff}
    .v-btn-primary:hover{opacity:.85}
    .v-btn-secondary{background:#222;color:#c2c0b8;border:1px solid #3a3a37}
    .v-btn-secondary:hover{background:#2a2a28}

    /* Reload */
    #reload-btn{display:none;margin:0 auto;padding:10px 24px;background:#222;color:#c2c0b8;border:1px solid #3a3a37;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
    #reload-btn:hover{background:#2a2a28}
  </style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← Volver</a>
  <h1>▶️ Videos guardados</h1>
</div>

<div class="container">
  <div id="spinner">
    <div class="spin"></div>
    <div class="spin-label">Cargando videos…</div>
  </div>

  <div id="error-box"></div>
  <div id="empty-box">📭 Aún no hay videos guardados.<br>¡Sube el primero!</div>
  <div id="videos-list"></div>

  <button id="reload-btn" onclick="cargar()">🔄 Recargar</button>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvy-Qcwaw1H2CLQ8L_P-rAHQd8pJ5v_ZjINVGDJ1yL6pW_MnQWzzXmNaDtP-oXUbuW/exec";

const spinner   = document.getElementById("spinner");
const errorBox  = document.getElementById("error-box");
const emptyBox  = document.getElementById("empty-box");
const videoList = document.getElementById("videos-list");
const reloadBtn = document.getElementById("reload-btn");

window.addEventListener("load", cargar);

async function cargar() {
  spinner.style.display  = "flex";
  errorBox.style.display = "none";
  emptyBox.style.display = "none";
  videoList.innerHTML    = "";
  reloadBtn.style.display = "none";

  try {
    const res  = await fetch(SCRIPT_URL);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    spinner.style.display = "none";

    if(!data.videos || data.videos.length === 0) {
      emptyBox.style.display = "block";
      reloadBtn.style.display = "block";
      return;
    }

    // Mostrar videos en orden inverso (más reciente primero)
    const videos = data.videos.reverse();
    videos.forEach((v, i) => {
      const fecha = v.fecha ? new Date(v.fecha).toLocaleString("es-MX") : "—";
      const card  = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <video controls playsinline preload="metadata" src="${v.url}"></video>
        <div class="video-info">
          <div class="video-name">${v.name || "Video " + (i+1)}</div>
          <div class="video-meta">📅 ${fecha}</div>
          <div class="video-actions">
            <a class="v-btn v-btn-primary" href="${v.url}" target="_blank">⬇️ Descargar</a>
            <button class="v-btn v-btn-secondary" onclick="copiar('${v.url}', this)">🔗 Copiar URL</button>
          </div>
        </div>
      `;
      videoList.appendChild(card);
    });

    reloadBtn.style.display = "block";

  } catch(err) {
    spinner.style.display  = "none";
    errorBox.style.display = "block";
    errorBox.innerHTML = `<strong>❌ Error:</strong> ${err.message}<br><br><button onclick="cargar()" style="padding:8px 16px;background:#222;color:#c2c0b8;border:1px solid #3a3a37;border-radius:8px;cursor:pointer;font-size:13px">Reintentar</button>`;
  }
}

function copiar(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = "✅ Copiado";
    setTimeout(() => btn.textContent = "🔗 Copiar URL", 2000);
  });
}
</script>
</body>
</html>
