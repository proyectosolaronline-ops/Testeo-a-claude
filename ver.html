<body style="text-align:center;background:#000;color:#fff" onload="v()">
  <a href="subir.html" style="color:#fff">SUBIR OTRO</a><br>
  <video id="p" controls style="width:100%;max-width:600px;margin-top:20px"></video>

  <script>
    async function v(){
      const r = await fetch("URL_ACA");
      const d = await r.json();
      if(d.url){
        const p = document.getElementById('p');
        p.src = d.url;
        p.muted = true;
        p.onloadedmetadata = () => p.currentTime = 0.1;
        p.load();
      }
    }
  </script>
</body>
